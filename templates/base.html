<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dani Stack Wear{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
  
  
<body>
  
  <header>
    <nav class="base-nav">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('products_list') }}">Products</a>
      <a href="{{ url_for('cart') }}">Cart</a>
    </nav>
  </header>

  {% block content %}
  {% endblock %}

  <footer>
  <p>
    Dani Stack Wear is a fictional e-commerce project created for
    demonstration and portfolio purposes.
  </p>

  <p>
    This website is not affiliated with a real business and does not
    process real orders or payments.
  </p>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
